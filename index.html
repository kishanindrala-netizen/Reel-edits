<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Beat Reel Maker</title>
</head>
<body>
<header><h1>Beat Reel Maker</h1></header>
<main>
  <section class="left">
    <div class="stage"><canvas id="cv" width="540" height="960"></canvas></div>
    <div class="row">
      <button id="play" disabled>▶ Play</button>
      <span id="clock">0.0 / 0.0s</span>
    </div>
    <div class="row">
      <label>Format
        <select id="ratio">
          <option value="9:16">9:16 Reel</option>
          <option value="4:5">4:5</option>
          <option value="1:1">1:1</option>
        </select>
      </label>
      <label>Quality
        <select id="quality"><option value="720">720p</option><option value="1080">1080p</option></select>
      </label>
      <button id="export" disabled>Export video</button>
    </div>
    <div id="status" class="status"></div>
    <a id="dl" class="dl" hidden>Download</a>
  </section>

  <section class="right">
    <h2>1. Song</h2>
    <div class="row">
      <input type="file" id="song" accept="audio/*">
    </div>
    <div class="row">
      <label>Length
        <select id="len">
          <option>15</option><option selected>30</option><option>60</option><option>90</option>
        </select> s
      </label>
      <label>Start <input type="range" id="start" min="0" max="0" step="0.1" value="0"><span id="startv">0.0s</span></label>
    </div>
    <canvas id="wave" height="90"></canvas>

    <h2>2. Cuts</h2>
    <div class="row">
      <label>Cut on
        <select id="mode">
          <option value="1">every beat</option>
          <option value="2">every 2 beats</option>
          <option value="4" selected>every 4 beats (bar)</option>
          <option value="8">every 8 beats</option>
          <option value="drops">drops only</option>
        </select>
      </label>
      <label>Nudge <input type="range" id="nudge" min="-150" max="150" step="5" value="0"><span id="nudgev">0ms</span></label>
    </div>
    <div id="info" class="status">Load a song to analyse beats.</div>

    <h2>3. Media</h2>
    <div class="row">
      <input type="file" id="media" accept="video/*,image/*" multiple>
      <button id="auto" disabled>Auto-fill</button>
    </div>
    <div id="bin" class="bin"></div>

    <h2>4. Timeline</h2>
    <div class="hint">Tap a slot, then tap a media thumbnail (or drag it onto the slot). Pick a transition for each cut.</div>
    <div id="timeline" class="timeline"></div>
    <div id="slotpanel" class="slotpanel" hidden>
      <label>Transition in <select id="trans"></select></label>
      <label id="inrow">Clip start <input type="range" id="inpt" min="0" max="60" step="0.1" value="0"><span id="inv">0.0s</span></label>
      <button id="applyall">Apply transition to all</button>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
